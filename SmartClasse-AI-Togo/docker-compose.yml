services:
  ollama:
    image: ollama/ollama:latest
    container_name: smartclasse-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: smartclasse-ollama-pull
    profiles:
      - setup
    depends_on:
      - ollama
    entrypoint: ["ollama"]
    command: ["pull", "gemma4:e4b"]
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartclasse-backend
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      PORT: 8000
    ports:
      - "8010:8000"
    volumes:
      - ./:/app
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  ollama_data:
